                                Saving/Creating Budgets
                                <br/>
                                <br/>
                                Scenario: Budgets for sub category occur at irregular intervals.
                                <br/>
                                They collide for the same sub category for a given month (auto maintenance).
                                <br/>
                                Each has a name determining what it is for (car tires, oil change, etc)
                                <br/>
                                Behavior: Both budgets are listed under the sub category and are combined for the sub category total budget.
                                <br/>
                                <br/>
                                YES WE NEED BUDGETS. For spending that is not based on 1:1 transactions ie grocery for a whole month, fuel, fun$$$.
                                <br/>
                                Maybe there are only one or two regular transactions but you can't say (or don't want to limit) exactly when they happen.
